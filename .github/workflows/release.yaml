name: Release
on:
  - push
  - pull_request
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Set environments
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> ${GITHUB_ENV}
          else
            echo "VERSION=x.y.z" >> ${GITHUB_ENV}
          fi
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "REF=${GITHUB_SHA}" >> ${GITHUB_ENV}
          else
            echo "REF=${GITHUB_REF_NAME}" >> ${GITHUB_ENV}
          fi
      - uses: actions/checkout@v7
      - name: Create source archive
        run: |
          name="openarm-hardware-${VERSION}"
          git archive --format=tar ${REF} \
            --prefix "${name}/" | tar -xf -

          while IFS=$'\t' read -r id path; do
            mkdir -p "${name}/$(dirname "${path}")"
            # "confirm=t" skips the "Google Drive can't scan this file
            # for viruses" confirmation page that is returned instead
            # of the file itself for large (100MB+) files.
            content_type=$(curl \
              --fail \
              --location \
              --show-error \
              --silent \
              --output "${name}/${path}" \
              --write-out '%{content_type}' \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t")
            case "${content_type}" in
              text/html*)
                echo "::error::Failed to download ${path} (${id}): Google Drive returned an HTML page instead of the file"
                exit 1
                ;;
            esac
            echo "Downloaded ${path} ($(stat -c %s "${name}/${path}") bytes)"
          done < ./dev/google-drive-files/file-ids.tsv

          tar -czf ${name}.tar.gz ${name}

          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          sha512sum "${name}.tar.gz" > "${name}.tar.gz.sha512"
      - uses: actions/upload-artifact@v7
        with:
          name: source-archive
          path: openarm-hardware-*.tar.gz*
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME}
          gh release create ${GITHUB_REF_NAME} \
            --discussion-category Announcements \
            --generate-notes \
            --repo ${GITHUB_REPOSITORY} \
            --title "OpenArm Hardware ${version}" \
            --verify-tag \
            openarm-hardware-${GITHUB_REF_NAME}.tar.gz*
